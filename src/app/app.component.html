<div class="container">
  <app-header         (logout)="handleLogout()" [authenticated]="isAuthenticated"></app-header>
  <main *ngIf="isAuthenticated" class = "content px-6">
    <app-breadcrumbs></app-breadcrumbs>
    <app-course-page></app-course-page>
  </main>
  <app-login *ngIf="!isAuthenticated" (loginData)="handleLogin($event)"></app-login>
  <app-footer></app-footer>
</div>
