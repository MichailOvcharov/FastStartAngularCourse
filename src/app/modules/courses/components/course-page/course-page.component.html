<div *ngIf="!showCourseForm" class = "flex justify-content-between align-items-center">
  <app-search (search)="onSearch($event)"></app-search>
  <app-add-button (click)="onAddCourse()"></app-add-button>
</div>

<p-confirmDialog
  header="Удалит курс?"
  icon="pi pi-exclamation-triangle"
  acceptLabel="Удалить"
  rejectLabel="Отмена"
  acceptButtonStyleClass="p-button-danger"
  rejectButtonStyleClass="p-button-text"
  [style]="{width: '550px'}">
</p-confirmDialog>

<div *ngIf="!showCourseForm">
  <div *ngIf="filteredCourses.length>0; else notFound">
    <app-course-item *ngFor="let course of filteredCourses  | orderby: 'creation_date'"
                     [course]="course"
                     (edit)="onEdit($event)"
                     (delete)="confirmDelete(course.id)">
    </app-course-item>
  </div>

  <ng-template #notFound>
    <div class="not-found-container">
      <img src="././assets/banned_2.png" alt="logotype" class="logo-image">
      <h2>Ничего не найдено</h2>
      <button (click)="resetSearch()">Сбросить фильтры</button>
    </div>
  </ng-template>
</div>

<div *ngIf="showCourseForm">
  <div>
    <app-add-edit-course
      (cancel)="onCancelEdit()"
      (save)="onCourseSaved($event)"
    ></app-add-edit-course>
  </div>
</div>

<div *ngIf="!showCourseForm" class="flex justify-content-center pt-3 container" style="margin-bottom: 6rem;">
  <button pButton
          type="button"
          label="Загрузить еще"
          class="p-button-lg  double-width"
          style="background-color: var(--surface-ground); color: grey"
          (click)="load()">
  </button>
</div>
